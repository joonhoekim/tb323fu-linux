# SPDX-License-Identifier: MIT
[package]
name = "tb323fu-helper-core"
description = "Device model of the Lenovo TB323FU for tb323fu-helperd: sysfs paths, features, configuration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
sha2.workspace = true
serde_json.workspace = true
# kernel updates: minisign signature check (pure Rust) and gzip'd kernels
minisign-verify = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# signs test indexes and manifests with throw-away keys
minisign = { version = "0.7", default-features = false }
