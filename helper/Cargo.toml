[workspace]
resolver = "2"
members = ["crates/tb323fu-helper-core", "crates/tb323fu-helperd", "crates/tb323fu-ctl"]
# the GTK settings app is its own workspace so the daemon builds without GTK dev libraries
exclude = ["crates/tb323fu-settings"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/joonhoekim/tb323fu-linux"

[workspace.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
sha2 = "0.10"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
