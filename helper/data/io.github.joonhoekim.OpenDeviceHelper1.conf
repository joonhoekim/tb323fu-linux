<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only root runs the daemon -->
  <policy user="root">
    <allow own="io.github.joonhoekim.OpenDeviceHelper1"/>
  </policy>
  <!-- anyone may talk to it; each method checks polkit -->
  <policy context="default">
    <allow send_destination="io.github.joonhoekim.OpenDeviceHelper1"/>
  </policy>
</busconfig>
