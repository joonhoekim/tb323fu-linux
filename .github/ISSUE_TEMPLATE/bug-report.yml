# SPDX-License-Identifier: MIT
name: Bug report
description: Something on your tablet does not work, and you can say how to see it
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, remove anything that identifies your tablet or network: the S/N, mobile identifiers, Wi-Fi network names, MAC addresses.
        Check [Hardware status](https://github.com/joonhoekim/tb323fu-linux/blob/main/docs/hardware-status.md) first: known issues are listed there.
  - type: dropdown
    id: reached
    attributes:
      label: Did Linux reach the desktop (or a login prompt)?
      options:
        - "Yes"
        - "No: it stops at the Lenovo logo"
        - "No: it stops during the text summary"
        - "No: black screen"
        - "No: it restarts by itself"
        - "No: something else (describe it below)"
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Self-check
      description: "If Linux starts: paste the output of `tb323fu-check --markdown` (platform package 0.4.5 or newer). It holds no device IDs, addresses or network names; look it over all the same. If Linux does not start, leave this empty and fill in the fields below."
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "`uname -r`, and the release tag if it came from a release (for example kernel-t40)"
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root filesystem
      description: "Distribution and version, and which partition it boots from (for example Debian 13 on baldur-root)"
    validations:
      required: true
  - type: input
    id: helper
    attributes:
      label: Open Device Helper version
      description: "`tb323fu-ctl versions`, or \"not installed\""
  - type: input
    id: firmware
    attributes:
      label: Android firmware
      description: "Region (PRC / ROW) and the Android build the firmware was extracted from"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Logs (`journalctl -b`, `dmesg`) as text, not screenshots.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Attach the export from `tb323fu-ctl diagnostics export` (or Diagnostics → Export in the app). It is sanitized, but look through it before attaching."
