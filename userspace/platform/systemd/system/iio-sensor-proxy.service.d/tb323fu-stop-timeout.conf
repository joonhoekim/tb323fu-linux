# The system-sleep hook (tb323fu-sensors) stops iio-sensor-proxy before every
# suspend. It normally exits in 0.3 s, but it has been seen ignoring SIGTERM,
# and the default 90 s stop timeout then held the suspend with the user
# session frozen (black screen, power key ignored). Kill it after 3 s instead.
[Service]
TimeoutStopSec=3
