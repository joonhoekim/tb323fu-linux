# SPDX-License-Identifier: MIT
# udev starts iio-sensor-proxy when the ADSP's fastrpc node appears, before
# hexagonrpcd has attached the sensor hub; a probe that finishes first finds no
# sensors and exits 0. Start it again until they are there. No After=hexagonrpcd:
# that unit is ordered after multi-user.target, which would make an ordering cycle.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
