# SPDX-License-Identifier: MIT
# Sensors: the sensor hub (SSC) runs on the ADSP, whose fastrpc node here is
# only the secure one; the DSP libraries, sensor configs, registry and socinfo
# go under /usr/share/qcom/kaanapali/Lenovo/TB323FU (built from the device's
# dsp and persist partitions and its vendor partition). Start after the DSPs.
[Unit]
After=tb323fu-dsp.service
Wants=tb323fu-dsp.service

[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-adsp-secure
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/kaanapali/Lenovo/TB323FU
