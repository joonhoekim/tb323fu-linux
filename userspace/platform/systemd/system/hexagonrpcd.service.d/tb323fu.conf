# SPDX-License-Identifier: MIT
# Sensors: the sensor hub (SSC) runs on the ADSP, whose fastrpc node here is
# only the secure one. tb323fu-sensors-tree builds the files it serves (DSP
# libraries, sensor configs, registry, socinfo) from the device's dsp, vendor
# and persist partitions on first start. Start after the DSPs.
[Unit]
After=tb323fu-dsp.service tb323fu-sensors-tree.service
Wants=tb323fu-dsp.service tb323fu-sensors-tree.service

[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-adsp-secure
Environment=hexagonrpcd_fw_dir=/var/lib/tb323fu/sensors
