# The plain ALSA speaker sink bypasses the protecting "Speakers" filter chain
# (pipewire.conf.d/60-tb323fu-speakers.conf)
# while the amplifiers run at SPEAKER_ATTEN_PROTECTED -- name it so, and keep
# it from ever being picked as the default output.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        node.description = "Speakers (raw, unprotected)"
        priority.session = 100
      }
    }
  }
]
