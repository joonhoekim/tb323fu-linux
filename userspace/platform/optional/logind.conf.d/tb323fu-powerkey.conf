# OPTIONAL. A short press of the power key -- the natural way to wake a blanked
# console -- powers the tablet off under logind's default. This makes logind
# ignore short presses (a long press still powers off). Desktops that handle
# the power key themselves (GNOME: suspend) keep working; without such a
# desktop a short press then does nothing.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
