# DISTRO-SPECIFIC (Debian 13, Ubuntu 26.04): the packaged iio-sensor-proxy (3.7,
# 3.8) has no SSC (libssc) backend, so a locally built 3.9 with libssc runs from
# /usr/local (rootfs/ubuntu/iio-ssc.sh builds it).
# Distributions that ship iio-sensor-proxy >= 3.8 built with libssc only need
# RestrictAddressFamilies and the restart settings below.
# libssc talks QMI over QRTR, which the packaged unit's RestrictAddressFamilies
# leaves out; the sensors come up late (ADSP, hexagonrpcd), and with none the
# proxy exits 0, hence the retries. No After=hexagonrpcd: that unit is ordered
# after multi-user.target, which would make an ordering cycle.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
RestrictAddressFamilies=AF_QIPCRTR
Restart=always
RestartSec=5
