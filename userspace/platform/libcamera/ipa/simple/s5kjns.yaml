# s5kjns on the Lenovo TB323FU, libcamera 0.7 simple IPA.
# Black level measured with the lens covered: 64 at 10 bits on every channel,
# at minimum and maximum analogue gain (the sensor clamps it) = 4096 on
# libcamera's 16-bit scale. No color matrix yet (needs a ColorChecker shot).
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
...
