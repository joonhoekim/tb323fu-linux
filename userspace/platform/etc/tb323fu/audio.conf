# SPDX-License-Identifier: MIT
# Speaker and microphone defaults, applied whenever the sound card appears
# (91-tb323fu-audio.rules, tb323fu-audio-defaults) and by tb323fu-speaker-gain.
#
# SPEAKER_ATTEN: the AW882xx amplifiers' own attenuation, 0..1023 in steps of
# about 0.094 dB (aw_dev_0_volume / aw_dev_1_volume); the driver writes the
# value plus an offset of 11 into the chip (Android runs the chip at 11, i.e.
# attenuation 0). 159 (16 dB) is the SAFE value with no protection at all: a
# full-scale tone then draws what Android's maximum does. Set at boot and
# whenever PipeWire is not running.
SPEAKER_ATTEN=159

# SPEAKER_ATTEN_PROTECTED: used only while PipeWire runs (the user unit
# tb323fu-speaker-gain.service), when the "Speakers" filter chain (high-pass,
# compressor, RMS cap, limiter; pipewire.conf.d/60-tb323fu-speakers.conf)
# protects the speakers. 21 = 2 dB under Android's maximum amplifier voltage
# (measured with battery current: raw pink noise at 0 drew +192 mA, Android's
# DSP chain at full volume +520 mA). The raw sink "Speakers (raw,
# unprotected)" bypasses the filter -- avoid it. Do not raise these values
# unless you know what you are doing: there is no DSP speaker protection.
SPEAKER_ATTEN_PROTECTED=21

# MIC_GAIN: the WCD9395 ADC analog gain for both microphones, 0..20
# (ADC1 Volume / ADC3 Volume), 1.5 dB steps. Android uses 12; 15 (+4.5 dB)
# sounded clean with a little more level in desktop recordings.
MIC_GAIN=15
